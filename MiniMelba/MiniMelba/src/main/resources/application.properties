server.port=3000

# PostgreSQL. Puedes sobrescribir estos valores con DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:minimelba}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Sesión (antes express-session): 8 horas, misma cookie
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=melba.sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=8h

# Crea tablas y productos de ejemplo al iniciar (antes: npm run init-db). Se puede dejar en true.
app.init-db=true
