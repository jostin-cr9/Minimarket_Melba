server.port=3000

# Base de datos (antes db.js + .env)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/minimelba?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.hikari.maximum-pool-size=10

# Sesión (antes express-session): 8 horas, misma cookie
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=melba.sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=8h

# Crea tablas y productos de ejemplo al iniciar (antes: npm run init-db). Se puede dejar en true.
app.init-db=true