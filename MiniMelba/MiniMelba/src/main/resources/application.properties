server.port=3000

# El archivo .env también contiene DB_* de MySQL. Esta aplicación usa PostgreSQL,
# por lo que su conexión se configura con PG_* para no mezclar ambos motores.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL. DB_HOST/DB_PORT/DB_USER/DB_PASSWORD del .env son para MySQL.
# Define PG_USER y PG_PASSWORD con las credenciales de PostgreSQL.
spring.datasource.url=${PG_URL:jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5433}/${PG_NAME:Minimarket_Melba}}
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Sesión (antes express-session): 8 horas, misma cookie
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=melba.sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=8h

# Crea tablas y productos de ejemplo al iniciar (antes: npm run init-db). Se puede dejar en true.
app.init-db=true
