<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimarket Melba | Productos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">MINIMARKET MELBA ·</p>
      <h1>Catálogo de productos</h1>
      <p>Administra el catálogo. </p>
    </header>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Nuevo producto</h2>
      <form id="product-form">
        <input id="product-id" type="hidden">
        <label>Código <input id="code" maxlength="30" required></label>
        <label>Nombre <input id="name" maxlength="120" required></label>
        <label>Categoría <input id="category" maxlength="60" required></label>
        <label>Unidad <input id="unit" maxlength="40" value="unidad"></label>
        <label>Precio <input id="price" type="number" min="0.01" step="0.01" required></label>
        <label>Stock <input id="stock" type="number" min="0" step="1" required></label>
        <label>Ruta de imagen <input id="image" maxlength="255"></label>
        <div class="actions">
          <button type="submit" class="primary">Guardar</button>
          <button type="reset" id="cancel-edit">Limpiar</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Productos activos</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
          <tbody id="products"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/products.js" defer></script>
</body>
</html>
